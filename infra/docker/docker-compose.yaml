services:
  # =========================================================================
  # Auth Service
  # =========================================================================
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@auth-db:5432/auth_db?sslmode=disable
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private.pem
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public.pem
    volumes:
      - auth_app_data:/var/lib/app/data
      - ../../services/auth-service/keys/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ../../services/auth-service/keys/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - shopsphere-network

  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ../../services/auth-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - shopsphere-network

  # =========================================================================
  # Future Services Template (Uncomment and customize as you add services)
  # =========================================================================
  # product-service:
  #   build:
  #     context: ../../services/product-service
  #     dockerfile: Dockerfile
  #   container_name: product-service
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8081"
  #   networks:
  #     - shopsphere-network

volumes:
  auth_db_data:
  auth_app_data:

networks:
  shopsphere-network:
    driver: bridge
